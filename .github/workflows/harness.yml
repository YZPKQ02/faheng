name: quality-harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts/run_harness.py
      - name: Backend tests
        run: pytest -q
      - name: Offline harness
        run: python scripts/run_harness.py run --profile offline --output artifacts/harness/offline
      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: web
        run: pnpm test
      - name: Frontend build
        working-directory: web
        run: pnpm build
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-harness-report
          path: artifacts/harness/offline
          if-no-files-found: ignore

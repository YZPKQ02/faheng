name: quality-harness

permissions:
  contents: read

concurrency:
  group: quality-harness-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legal_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts/run_harness.py
      - name: Backend tests
        run: pytest -q
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/legal_ci
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Offline harness
        run: python scripts/run_harness.py run --profile offline --output artifacts/harness/offline
      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: web
        run: pnpm test
      - name: Frontend typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit --incremental false
      - name: Frontend build
        working-directory: web
        run: pnpm build
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-harness-report
          path: artifacts/harness/offline
          if-no-files-found: ignore
